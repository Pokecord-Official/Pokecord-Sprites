name: Exceptions
# Push to master, or config_updated from Pokecord-Module -> rebuild spriteExceptions.json, commit it,
# then dispatch parse_data to Pokecord-Module. Reading the private Module repo and dispatching to it use a
# short-lived token from the "Pokecord Asset Pipeline" GitHub App (no long-lived PAT).
on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [config_updated]
permissions:
  contents: write # commit spriteExceptions.json
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Token for Pokecord-Module
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          repositories: Pokecord-Module
          permission-contents: write
      - name: Pull dexToPokemon and sharedConfig from Pokecord-Module
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw+json" repos/Pokecord-Official/Pokecord-Module/contents/src/dexToPokemon.json > dexToPokemon.json
          gh api -H "Accept: application/vnd.github.raw+json" repos/Pokecord-Official/Pokecord-Module/contents/sharedConfig.json > sharedConfig.json
      - name: Install Dependencies
        run: npm install
      - name: Run script
        run: node index.js
        env:
          # index.js reads this repo's own (public) tree through the API; GITHUB_TOKEN is enough
          PAT: ${{ github.token }}
      - name: Commit Changes
        run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f spriteExceptions.json
            git commit -m "Auto Parsed Sprite Exceptions" || echo "No changes to commit"
            git push
      - name: Send Dispatch Event
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/Pokecord-Official/Pokecord-Module/dispatches -f event_type=parse_data
